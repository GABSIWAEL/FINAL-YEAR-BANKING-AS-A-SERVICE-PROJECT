version: "3.9"

services:

  account-db:
    image: postgres:15-alpine
    container_name: account-db
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  account.dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: dashboard_ACCOUNT
    ports:
      - "18888:18888"
      - "18889:18889"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.monitoring.collection.enabled=true
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      xpack.security.enabled: "false"
      xpack.monitoring.enabled: "true"
      xpack.monitoring.ui.container.elasticsearch.enabled: "true"
      xpack.fleet.enabled: "false"
      xpack.fleet.agents.enabled: "false"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  account-service:
    build:
      context: .
      dockerfile: OpenBanking_ACCOUNT_V1/Dockerfile
    container_name: account-service
    ports:
      - "8088:8088"
      - "8089:8089"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=account-db;Port=5432;Username=postgres;Password=mysecretpassword;Database=accountdb
    depends_on:
      account-db:
        condition: service_healthy
    networks:
      - default
      - kong-net

  branch-db:
    image: mysql:5.7
    container_name: branch-db
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: branchdb
    ports:
      - "3306:3306"
    volumes:
      - branch-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  branch-service:
    build:
      context: .
      dockerfile: OpenBanking_BRANCH_V1/Dockerfile
    container_name: branch-service
    ports:
      - "8084:8084"
      - "8085:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=branch-db;Port=3306;Database=branchdb;User=root;Password=mysecretpassword;
    depends_on:
      branch-db:
        condition: service_healthy

  card-db:
    image: postgres:13
    container_name: card-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: carddb
    ports:
      - "5433:5432"
    volumes:
      - card-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  card-service:
    build:
      context: .
      dockerfile: OpenBanking_CARD_V1/Dockerfile
    container_name: card-service
    ports:
      - "8086:8086"
      - "8087:8087"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=card-db;Port=5432;Username=postgres;Password=mysecretpassword;Database=carddb
    depends_on:
      card-db:
        condition: service_healthy


  atm-service:
    build:
      context: .
      dockerfile: OpenBanking_ATM_V1/Dockerfile
    container_name: atm-service
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - mongodb://atm-db:27017/atmdb
    depends_on:
      atm-db:
        condition: service_healthy

  atm-db:
    image: mongo:latest
    container_name: atm-db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  mysqlAuth-db:
    image: mysql:5.7
    container_name: authdb
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: authdb
    ports:
      - "3307:3306"
    volumes:
      - authdb-data:/var/lib/mysql
      - ./init-auth-user.sql:/docker-entrypoint-initdb.d/init-auth-user.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  authenticator-service:
    build:
      context: .
      dockerfile: OpenBanking_AUTHENTICATOR_V1/Dockerfile
    container_name: authenticator-service
    ports:
      - "8090:8090"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=server=authdb;port=3306;database=authdb;user=appuser;password=apppassword;SslMode=none;
    depends_on:
      mysqlAuth-db:
        condition: service_healthy
    user: root
    networks:
    - kong-net
    - default
    volumes:
      - data-protection-keys:/root/.aspnet/DataProtection-Keys

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  redis:
    image: redis:latest
    container_name: redisaouth
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./OpenBanking_ANGULAR_V1
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    volumes:
      - ./uploads:/shared/openBanking/uploads
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default  


  notification-service:
    build:
      context: .
      dockerfile: OpenBanking_NOTIFICATION_V1/Dockerfile
    container_name: notification-service
    ports:
      - "9094:9094"
      - "9095:9095"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=kalo
      - RabbitMQ__Password=kalo
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"     # Messaging
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

  kong-database:
    image: postgres:11
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    ports:
      - "5440:5432"
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-net

  kong-migrations:
    image: kong:3.6
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
    networks:
      - kong-net

  kong:
    image: kong:3.6
    container_name: kong
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    restart: always
    networks:
      - kong-net

  konga:
    image: pantsel/konga
    container_name: konga
    ports:
      - "1337:1337"
    environment:
    - DB_ADAPTER=postgres
    - DB_HOST=kong-database
    - DB_PORT=5432
    - DB_USER=kong
    - DB_PASSWORD=kongpass
    - DB_DATABASE=kong


    depends_on:
      kong-database:
        condition: service_healthy
      kong:
        condition: service_started
    volumes:
      - konga-data:/app/kongadata
    networks:
      - kong-net
  test-client:
    image: curlimages/curl:8.5.0
    container_name: test-client
    depends_on:
      - kong
    networks:
      - kong-net
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache bash && bash /scripts/consume_kong_service.sh"]
    volumes:
      - ./consume_kong_service.sh:/scripts/consume_kong_service.sh

networks:
  kong-net:
    driver: bridge

volumes:
  konga-data:
    name: konga-data
  kong-db-data:
    name: kong-db-data
  account-db-data:
  branch-db-data:
  card-db-data:
  authdb-data:
  rabbitmq-lib:
  rabbitmq-log:
  esdata:
  grafana-data:
  data-protection-keys:
