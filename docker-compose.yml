version: '3.8'

services:
  account-service:
    build:
      context: .
      dockerfile: OpenBanking_ACCOUNT_V1/Dockerfile
    container_name: account-service
    ports:
      - "8088:8088"
      - "8089:8089"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Host=account-db;Port=5432;Username=postgres;Password=mysecretpassword;Database=accountdb
    depends_on:
      - account-db

  atm-service:
    build:
      context: .
      dockerfile: OpenBanking_ATM_V1/Dockerfile
    container_name: atm-service
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=mongodb://atm-db:27017/atmdb
    depends_on:
      - atm-db

  branch-service:
    build:
      context: .
      dockerfile: OpenBanking_BRANCH_V1/Dockerfile
    container_name: branch-service
    ports:
      - "8084:8084"
      - "8085:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=mysql://branch-db:3306/branchdb
    depends_on:
      - branch-db

  card-service:
    build:
      context: .
      dockerfile: OpenBanking_CARD_V1/Dockerfile
    container_name: card-service
    ports:
      - "8086:8086"
      - "8087:8087"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Host=card-db;Port=5432;Username=postgres;Password=mysecretpassword;Database=carddb
    depends_on:
      - card-db

  # Database Services
  account-db:
    image: postgres:13
    container_name: account-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=accountdb
    ports:
      - "5432:5432"

  atm-db:
    image: mongo:latest
    container_name: atm-db
    ports:
      - "27017:27017"

  branch-db:
    image: mysql:5.7
    container_name: branch-db
    environment:
      - MYSQL_ROOT_PASSWORD=mysecretpassword
      - MYSQL_DATABASE=branchdb
    ports:
      - "3306:3306"

  card-db:
    image: postgres:13
    container_name: card-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=carddb
    ports:
      - "5433:5433"
