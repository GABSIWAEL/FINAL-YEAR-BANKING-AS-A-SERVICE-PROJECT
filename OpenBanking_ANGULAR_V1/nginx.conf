events {
    
}

http {
 # ------------------------------------------------------------------------------------------------------------------------
 #                                          NGINX PARAMS AND RULES 
 # ------------------------------------------------------------------------------------------------------------------------
    client_max_body_size 10M;
    include mime.types;
 # ------------------------------------------------------------------------------------------------------------------------
 #                                          RENAME SERVEURS ENDPOINTS 
 # ------------------------------------------------------------------------------------------------------------------------
    upstream authenticator {
        server authenticator-service:8090;
    }
    upstream Accounts {
        server account-service:8088;
    }
    upstream Branchs {
        server branch-service:8084;
    }
    upstream Cards {
        server card-service:8086;
    }
    upstream Notifications {
        server notification-service:9094;
    }
 # ------------------------------------------------------------------------------------------------------------------------
 #                                          MAIN SYSTEM PROXIES  
 # ------------------------------------------------------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, must-revalidate";
        }
 # ------------------------------------------------------------------------------------------------------------------------
 #                                          REVERSE PROXY FOR THE RESSOURCES ENDPOINTS 
 # ------------------------------------------------------------------------------------------------------------------------
         #  THIS BLOCK IS FOR THE PUBLIC AND THE WEB RESSOURCES 
        location /uploads/ {
            alias /shared/openBanking/uploads/;
            valid_referers none blocked localhost:4200;
            if ($invalid_referer) {
                return 403;
            }
            add_header Cache-Control "no-store, must-revalidate";
        }
        #  THIS BLOCK IS FOR THE PUBLIC AND THE WEB RESSOURCES ESSENTIALLY FOR THE CLIENTS ACCOUNTS AND RESSOURCES 
        location /uploads/client/ {
            alias /shared/openBanking/uploads/client/;
            autoindex off;
            location ~* \.(php|pl|py|sh|cgi|exe|bat)$ {
                deny all;
                return 403;
            }
        }
        #  THIS BLOCK IS PRIVATE  FOR THE PAIEMENTS RESSOURCES 
        location /uploads/fiche_de_paix/ {
            alias /shared/openBanking/uploads/fiche_de_paix/;
            autoindex off;
            location ~* \.(php|pl|py|sh|cgi|exe|bat)$ {
                deny all;
                return 403;
            }
        }
        #  THIS BLOCK IS PRIVATE 
        location /uploads/pdf_contrats/ {
            alias /shared/openBanking/uploads/pdf_contrats/;
            autoindex off;
            location ~* \.(php|pl|py|sh|cgi|exe|bat)$ {
                deny all;
                return 403;
            }
        }
        #  THIS BLOCK IS PRIVATE ONLY FOR ADMINS 
        location /uploads/archives_admin/ {
            alias /shared/openBanking/uploads/archives_admin/;
            autoindex off;
            location ~* \.(php|pl|py|sh|cgi|exe|bat)$ {
                deny all;
                return 403;
            }
        }
        #  THIS BLOCK IS FOR THE PUBLIC AND THE WEB RESSOURCES 
        location /uploads/website/ {
            alias /shared/openBanking/uploads/website/;
            autoindex off;
            location ~* \.(php|pl|py|sh|cgi|exe|bat)$ {
                deny all;
                return 403;
            }
        }

 # ------------------------------------------------------------------------------------------------------------------------
 #                                          REVERSE PROXY FOR THE BACKEND ENDPOINTS 
 # ------------------------------------------------------------------------------------------------------------------------

        # AUTHENTICATION BLOCK
        location /authenticator/ {
            proxy_pass http://authenticator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # ACCOUNTS BLOCK
        location /Accounts/ {
            proxy_pass http://Accounts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # BRANCHES  BLOCK
        location /Branchs/ {
            proxy_pass http://Branchs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # CARDS BLOCK
        location /Cards/ {
            proxy_pass http://Cards/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # CARDS BLOCK
        location /Notifications/ {
            proxy_pass http://Notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
 # ------------------------------------------------------------------------------------------------------------------------


    }

    
}
