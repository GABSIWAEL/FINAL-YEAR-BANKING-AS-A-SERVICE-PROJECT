apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: card-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: card-db
  template:
    metadata:
      labels:
        app: card-db
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "mysecretpassword"
            - name: POSTGRES_DB
              value: "carddb"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: card-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: card-db
spec:
  selector:
    app: card-db
  ports:
    - port: 5432
